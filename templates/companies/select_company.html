{% extends "base.html" %}

{% block content %}
<div style="max-width: 900px; margin: 40px auto; padding: 0 16px;">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
        
        <!-- Select Existing Company -->
        <div style="background:white; padding:24px; border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,0.08);">
            <h2 style="margin-top:0; margin-bottom:20px;">Select Company</h2>

            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom:16px;">
                    <label style="display:block; margin-bottom:6px; font-weight:600;">Choose Existing Company</label>
                    <select name="company_id" class="form-select" required>
                        <option value="">-- Select Company --</option>
                        {% for company in companies %}
                            <option value="{{ company.id }}">{{ company.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Continue</button>
            </form>
        </div>

        <!-- Create New Company -->
        <div style="background:white; padding:24px; border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,0.08);">
            <h2 style="margin-top:0; margin-bottom:20px;">Create New Company</h2>

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="create_company" value="1">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Company Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Company Code</label>
                    <input type="text" name="code" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Country</label>
                    <input type="text" name="country" class="form-control" value="Oman">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Currency</label>
                    <input type="text" name="currency" class="form-control" value="OMR">
                </div>

                <button type="submit" class="btn btn-success">Create & Continue</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
