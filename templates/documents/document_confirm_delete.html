{% extends "base.html" %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto; padding: 24px;">
    <div style="background: white; border-radius: 12px; padding: 28px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);">
        <h2 style="margin-top: 0; color: #b91c1c;">Delete Document</h2>

        <p>Are you sure you want to delete this document?</p>

        <div style="background:#f9fafb; padding:16px; border-radius:10px; margin:18px 0;">
            <p><strong>Title:</strong> {{ document.title }}</p>
            <p><strong>Employee:</strong> {{ document.employee|default:"-" }}</p>
            <p><strong>Expiry Date:</strong> {{ document.expiry_date|default:"-" }}</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <button type="submit"
                    style="background:#dc2626; color:white; padding:10px 18px; border:none; border-radius:8px; font-weight:600;">
                Yes, Delete
            </button>
            <a href="{% url 'document_detail' document.pk %}"
               style="margin-left:12px; color:#374151; text-decoration:none; font-weight:600;">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
