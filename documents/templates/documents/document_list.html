<!DOCTYPE html>
<html>
<head>
    <title>Document List</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">HR ERP</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="{% url 'dashboard' %}">Dashboard</a>
                <a class="nav-link text-white" href="{% url 'employee_list' %}">Employees</a>
                <a class="nav-link text-white active" href="{% url 'document_list' %}">Documents</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Document List</h1>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back to Dashboard</a>
        </div>

        <form method="get" class="mb-4">
            <div class="input-group">
                <input
                    type="text"
                    name="q"
                    class="form-control"
                    placeholder="Search documents..."
                    value="{{ query }}"
                >
                <button type="submit" class="btn btn-primary">Search</button>
                <a href="{% url 'document_list' %}" class="btn btn-outline-secondary">Clear</a>
            </div>
        </form>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Title</th>
                            <th>Employee</th>
                            <th>Company</th>
                            <th>Expiry Date</th>
                            <th>Uploaded At</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for doc in documents %}
                            <tr>
                                <td><a href="{% url 'document_detail' doc.pk %}">{{ doc.title }}</a></td>
                                <td>{{ doc.employee }}</td>
                                <td>{{ doc.company }}</td>
                                <td>{{ doc.expiry_date }}</td>
                                <td>{{ doc.uploaded_at }}</td>
                            </tr>
                        {% empty %}
                            <tr>
                                <td colspan="5" class="text-center py-4">No documents found.</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
